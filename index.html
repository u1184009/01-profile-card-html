<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Use UTF-8 character encoding so symbols display correctly -->
    <meta charset="UTF-8" />
    <!-- Make the page responsive on phones and tablets -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mike's Profile Card</title>
    <!-- Preconnect lets the browser open a connection early to Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Load the Roboto font family from Google Fonts using CSS -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet" />
    <!-- Apply custom page styles from the local stylesheet -->
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- Profile card container holds the name, role, and description -->
    <div class="profile-card">
      <img src="img/glep.PNG" alt="Glep">
      <h1>Mike Minh Pham</h1>
      <h2 class="role">Web Developer</h2>
      <p>A beginner web developer looking to better myself and find my place in the world</p>
      <h3>My Favorite Websites</h3>
      <ul class="favorite-sites">
        <li><a href="https://www.google.com" >Google</a></li>
        <li><a href="https://www.youtube.com/" >YouTube</a></li>
        <li><a href="https://battlenations.miraheze.org/wiki/Battle_Nations_Wiki" >Battle Nations Wiki</a></li>
      </ul>
    </div>
  </body>
</html>
